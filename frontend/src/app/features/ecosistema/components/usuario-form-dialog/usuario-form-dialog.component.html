<div class="dialog-backdrop" (click)="cancelled.emit()"></div>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="usr-title">
  <header>
    <div>
      <h2 id="usr-title">{{ esEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
      <p>Alta interna con identidad formal. La contraseña la define el administrador.</p>
    </div>
    <button type="button" class="close" aria-label="Cerrar" (click)="cancelled.emit()">×</button>
  </header>
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="grid">
      <label>
        DNI
        <input
          type="text"
          inputmode="numeric"
          formControlName="dni"
          maxlength="8"
          placeholder="8 dígitos"
          autocomplete="off"
        />
      </label>
      <label>
        Estado
        <select formControlName="activo">
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </label>
      <label>
        Nombres
        <input type="text" formControlName="nombres" maxlength="80" autocomplete="given-name" />
      </label>
      <label>
        Apellidos
        <input type="text" formControlName="apellidos" maxlength="80" autocomplete="family-name" />
      </label>
      <label class="wide">
        Correo / Usuario
        <input
          type="email"
          formControlName="email"
          maxlength="200"
          placeholder="usuario@empresa.pe"
          autocomplete="username"
        />
      </label>
      <label class="wide">
        Contraseña
        <input
          type="password"
          formControlName="password"
          maxlength="100"
          [placeholder]="esEdicion ? 'Dejar vacío para no cambiar' : 'Mínimo 8 caracteres'"
          autocomplete="new-password"
        />
      </label>
      <label class="wide">
        Rol
        <select formControlName="rol">
          @for (rol of roles; track rol) {
            <option [value]="rol">{{ etiquetas[rol] }}</option>
          }
        </select>
      </label>
    </div>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <footer>
      <button type="button" class="ghost" (click)="cancelled.emit()" [disabled]="enviando()">
        Cancelar
      </button>
      <button type="submit" class="primary" [disabled]="enviando()">
        {{ enviando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </form>
</section>
