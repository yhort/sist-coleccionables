<div class="dialog-backdrop" (click)="cancelar()"></div>

<section
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="devolucion-tienda-title"
  (click)="$event.stopPropagation()"
>
  <header class="dialog__header">
    <div>
      <h2 id="devolucion-tienda-title">Devolución de tienda</h2>
      <p>Pedido <code>{{ pedido().codigo }}</code> · {{ pedido().clienteNombre }}</p>
    </div>
    <button type="button" class="dialog__close" aria-label="Cerrar" [disabled]="guardando()" (click)="cancelar()">
      ×
    </button>
  </header>

  <div class="dialog__body">
    <p>
      Esta acción cancela el pedido, desvincula las cartas/productos, reingresa el 100% del stock al
      inventario activo (movimiento de kardex) y marca la logística como FALLIDA.
    </p>
    <label class="dialog__motivo">
      Motivo
      <select
        [value]="motivo()"
        [disabled]="guardando()"
        (change)="motivo.set($any($event.target).value)"
      >
        <option value="" disabled>Selecciona un motivo…</option>
        @for (opcion of motivos; track opcion) {
          <option [value]="opcion">{{ etiquetasMotivo[opcion] }}</option>
        }
      </select>
    </label>
    @if (error()) {
      <p class="dialog__error">{{ error() }}</p>
    }
  </div>

  <footer class="dialog__footer">
    <button type="button" class="ghost" [disabled]="guardando()" (click)="cancelar()">
      Cancelar
    </button>
    <button type="button" class="danger" [disabled]="!puedeConfirmar()" (click)="confirmar()">
      {{ guardando() ? 'Procesando…' : 'Confirmar devolución' }}
    </button>
  </footer>
</section>
