<div class="dialog-backdrop" (click)="cancelled.emit()"></div>

<section
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="caja-mov-title"
  (click)="$event.stopPropagation()"
>
  <header class="dialog__header">
    <div>
      <h2 id="caja-mov-title">Movimiento de caja chica</h2>
      <p>Ingresos y egresos manuales del turno (cambio extra, gastos menores, retiros).</p>
    </div>
    <button type="button" class="dialog__close" aria-label="Cerrar" (click)="cancelled.emit()">
      ×
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="dialog__grid">
      <fieldset class="sentido">
        <legend>Tipo</legend>
        <label>
          <input type="radio" formControlName="tipo" value="INGRESO" />
          Ingreso
        </label>
        <label>
          <input type="radio" formControlName="tipo" value="EGRESO" />
          Egreso
        </label>
      </fieldset>
      <label>
        Monto (S/)
        <input type="number" min="0.01" step="0.10" formControlName="monto" />
      </label>
      <label class="wide">
        Concepto
        <textarea
          formControlName="concepto"
          rows="3"
          maxlength="200"
          placeholder="Ej. taxi courier, cambio extra, retiro de efectivo…"
        ></textarea>
      </label>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <footer class="dialog__footer">
      <button type="button" class="ghost" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="primary" [disabled]="enviando()">
        {{ enviando() ? 'Registrando…' : 'Registrar' }}
      </button>
    </footer>
  </form>
</section>
