<div class="dialog-backdrop" (click)="cancelled.emit()"></div>

<section
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="caja-apertura-title"
  (click)="$event.stopPropagation()"
>
  <header class="dialog__header">
    <div>
      <h2 id="caja-apertura-title">Apertura de caja</h2>
      <p>Registra el saldo inicial de caja chica para iniciar el turno en la sede.</p>
    </div>
    <button type="button" class="dialog__close" aria-label="Cerrar" (click)="cancelled.emit()">
      ×
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="dialog__grid">
      <label>
        Sede
        <select formControlName="sedeId">
          <option value="">Seleccionar sede</option>
          @for (sede of sedes(); track sede.id) {
            <option [value]="sede.id">{{ sede.nombre }}</option>
          }
        </select>
      </label>
      <label>
        Monto de apertura (S/)
        <input type="number" min="0" step="0.10" formControlName="montoApertura" />
      </label>
      <label class="wide">
        Observación
        <textarea
          formControlName="observacion"
          rows="3"
          maxlength="500"
          placeholder="Ej. fondo de cambio del turno mañana…"
        ></textarea>
      </label>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <footer class="dialog__footer">
      <button type="button" class="ghost" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="primary" [disabled]="enviando()">
        {{ enviando() ? 'Abriendo…' : 'Abrir turno' }}
      </button>
    </footer>
  </form>
</section>
