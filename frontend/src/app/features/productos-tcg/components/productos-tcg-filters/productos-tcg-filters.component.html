<section class="filters" aria-label="Filtros del catálogo">
  <label class="filters__search">
    <span class="visually-hidden">Buscar por nombre, SKU o ID Woo</span>
    <input
      type="search"
      [ngModel]="filtros().busqueda"
      (ngModelChange)="filtros.set({ ...filtros(), busqueda: $event })"
      placeholder="Buscar nombre, SKU o ID Woo…"
    />
  </label>

  <label>
    <span>Tipo de producto</span>
    <select
      [ngModel]="filtros().tipoProducto"
      (ngModelChange)="filtros.set({ ...filtros(), tipoProducto: $event })"
    >
      <option value="TODOS">Todos</option>
      @for (tipo of tipos; track tipo[0]) {
        <option [value]="tipo[0]">{{ tipo[1] }}</option>
      }
    </select>
  </label>

  <label>
    <span>Categoría / juego</span>
    <select
      [ngModel]="filtros().juego"
      (ngModelChange)="filtros.set({ ...filtros(), juego: $event })"
    >
      <option value="TODOS">Todos</option>
      @for (juego of juegos; track juego[0]) {
        <option [value]="juego[0]">{{ juego[1] }}</option>
      }
    </select>
  </label>

  <label>
    <span>Estado de stock</span>
    <select
      [ngModel]="filtros().estadoStock"
      (ngModelChange)="filtros.set({ ...filtros(), estadoStock: $event })"
    >
      <option value="TODOS">Todos</option>
      @for (estado of estadosStock; track estado[0]) {
        <option [value]="estado[0]">{{ estado[1] }}</option>
      }
    </select>
  </label>

  <label>
    <span>Sincronización Woo</span>
    <select
      [ngModel]="filtros().sincronizacionWoo"
      (ngModelChange)="filtros.set({ ...filtros(), sincronizacionWoo: $event })"
    >
      <option value="TODOS">Todos</option>
      @for (estado of estadosSync; track estado[0]) {
        <option [value]="estado[0]">{{ estado[1] }}</option>
      }
    </select>
  </label>

  <button type="button" class="filters__clear" (click)="limpiar()">Limpiar</button>
</section>
