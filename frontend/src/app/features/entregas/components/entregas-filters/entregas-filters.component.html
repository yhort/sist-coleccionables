<section class="filters" aria-label="Filtros de entregas">
  <label>
    <span>Método de envío</span>
    <select [ngModel]="filtros().metodoEnvio" (ngModelChange)="actualizar('metodoEnvio', $event)">
      <option value="TODOS">Todos</option>
      @for (metodo of metodos; track metodo) {
        <option [value]="metodo">{{ etiquetasMetodo[metodo] }}</option>
      }
    </select>
  </label>
  <label>
    <span>Estado de logística</span>
    <select [ngModel]="filtros().estado" (ngModelChange)="actualizar('estado', $event)">
      <option value="TODOS">Todos</option>
      @for (estado of estados; track estado) {
        <option [value]="estado">{{ etiquetasEstado[estado] }}</option>
      }
    </select>
  </label>
  <label>
    <span>Sede origen</span>
    <select [ngModel]="filtros().sedeId" (ngModelChange)="actualizar('sedeId', $event)">
      <option value="TODAS">Todas</option>
      @for (sede of sedes(); track sede.id) {
        <option [value]="sede.id">{{ sede.nombre }}</option>
      }
    </select>
  </label>
  <label class="filters__search">
    <span>Pedido, cliente o tracking</span>
    <input
      type="search"
      placeholder="N° pedido, cliente, tracking…"
      [ngModel]="filtros().busqueda"
      (ngModelChange)="actualizar('busqueda', $event)"
    />
  </label>
  <button type="button" class="filters__clear" (click)="cleared.emit()">Limpiar</button>
</section>
