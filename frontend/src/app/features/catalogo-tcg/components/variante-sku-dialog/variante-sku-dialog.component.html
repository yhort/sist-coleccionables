<div class="dialog-backdrop" (click)="cancelled.emit()"></div>

<section
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="variante-title"
  (click)="$event.stopPropagation()"
>
  <header class="dialog__header">
    <div>
      <h2 id="variante-title">Alta de variante / SKU</h2>
      <p>
        {{ ficha().setCodigo }} #{{ ficha().numero }} · {{ ficha().nombre }} ·
        {{ ficha().rareza }}
      </p>
    </div>
    <button type="button" class="dialog__close" aria-label="Cerrar" (click)="cancelled.emit()">
      ×
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="dialog__grid">
      <label>
        Variante
        <select formControlName="variantePreset">
          @for (opcion of variantesPreset; track opcion) {
            <option [value]="opcion">{{ opcion }}</option>
          }
          <option [value]="varianteOtro">Otro (texto libre)</option>
        </select>
      </label>
      @if (usaVarianteLibre) {
        <label>
          Variante (texto libre)
          <input
            formControlName="varianteLibre"
            maxlength="64"
            placeholder="Ej. Full Art, Rainbow…"
          />
        </label>
      }
      <label>
        Estado
        <select formControlName="condicion">
          @for (condicion of condiciones; track condicion[0]) {
            <option [value]="condicion[0]">{{ condicion[1] }}</option>
          }
        </select>
      </label>
      <label>
        Idioma
        <select formControlName="idioma">
          @for (idioma of idiomas; track idioma[0]) {
            <option [value]="idioma[0]">{{ idioma[1] }}</option>
          }
        </select>
      </label>
      <label>
        Precio de venta (S/)
        <input
          type="number"
          class="input-monto"
          min="0"
          step="1"
          formControlName="precioVenta"
          (wheel)="$event.preventDefault()"
        />
      </label>
      <label>
        Costo (S/)
        <input
          type="number"
          class="input-monto"
          min="0"
          step="1"
          formControlName="costo"
          (wheel)="$event.preventDefault()"
        />
      </label>
      <label>
        SKU (opcional)
        <input formControlName="codigoSku" maxlength="64" placeholder="Se genera si queda vacío" />
      </label>
      <label>
        Sede
        <select formControlName="sedeId">
          <option value="">Sin ingreso de stock</option>
          @for (sede of sedes(); track sede.id) {
            <option [value]="sede.id">{{ sede.nombre }}</option>
          }
        </select>
      </label>
      <label>
        Stock inicial
        <input type="number" min="0" step="1" formControlName="stockInicial" />
      </label>
    </div>

    <p class="hint">
      El stock inicial entra al kardex como ajuste. Si dejas 0, el SKU queda en catálogo sin
      movimiento.
    </p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <footer class="dialog__footer">
      <button type="button" class="ghost" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="primary" [disabled]="guardando()">Crear SKU</button>
    </footer>
  </form>
</section>
