<div
  class="app-shell"
  [class.app-shell--sidebar-collapsed]="!isMobileViewport() && sidebarCollapsed()"
  [class.app-shell--mobile-sidebar-open]="isMobileViewport() && mobileSidebarOpen()"
>
  <app-sidebar id="main-sidebar" (routeSelected)="closeMobileSidebar()" />

  <button
    type="button"
    class="app-shell__overlay"
    aria-label="Cerrar menú principal"
    (click)="closeMobileSidebar()"
  ></button>

  <div class="app-shell__workspace">
    <app-topbar
      [pageTitle]="pageTitle()"
      [breadcrumbItems]="breadcrumbItems()"
      [userName]="userName()"
      [sedeLabel]="sedeLabel()"
      [menuExpanded]="menuExpanded()"
      menuControls="main-sidebar"
      (menuToggle)="toggleSidebar()"
      (logout)="cerrarSesion()"
    />

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
